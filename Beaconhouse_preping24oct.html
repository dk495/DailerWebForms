<html>
<head>
  <title>Beaconhouse Api Form</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    body {
      background-color: #f8f9fa; /* Light gray background */
    }
    .container {
      background-color: #ffffff; /* White background for the form container */
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); /* Subtle shadow for a modern look */
    }
    h2 {
      color: #007bff; /* Bootstrap primary color */
      margin-bottom: 20px;
    }
    .form-control {
      border-radius: 50px; /* Rounded input fields */
    }
    .btn-primary {
      border-radius: 50px; /* Rounded button */
      background-color: #007bff; /* Bootstrap primary color */
      border-color: #007bff;
    }
    .btn-primary:hover {
      background-color: #0056b3; /* Darker shade on hover */
      border-color: #0056b3;
    }
    .alert {
      margin-top: 20px; /* Space above the alert */
    }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Api Form (Beaconhouse)</h2>
    <form id="leadForm">
<div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="first_name">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" placeholder="example: john" "required>
                    </div>
</div>
<div class="col-md-6">
                    <div class="form-group">
                        <label for="last_name">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" placeholder="example: smith" required>
                    </div>
</div>

</div>
<div class="row">
<div class="col-md-6">
            <div class="form-group">
                <label for="phone_home">Phone Number:</label>
                <input type="tel" class="form-control" id="phone_home" name="phone_home" pattern="[0-9]{10}" required placeholder="Enter 10-digit phone number">
            </div>
 </div>
<div class="col-md-6">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="text" class="form-control" id="email" name="email" placeholder="example: smith@gmail.com" required>
                    </div>
</div>
          
</div>
        
    <div class="row">





  
<div class="col-md-4">
          <div class="form-group">
            <label for="zip">Zipcode</label>
            <input type="text" class="form-control" id="zip" placeholder="5 digit zipcode" required>
          </div>
        </div>
<div class="col-md-4">
          <div class="form-group">
            <label for="City">City</label>
            <input type="text" class="form-control" id="city" placeholder="Enter City here" required>
          </div>
        </div>
<div class="col-md-4">
                    <div class="form-group">
                        <label for="jornaya_lead_id">Jornaya Lead ID</label>
                        <input type="text" class="form-control" id="jornaya_lead_id" name="jornayaleadid" placeholder="" required>
                    </div>
</div>

 </div>



<div class="row">

<div class="col-md-12">
<div class="form-group">
 <label for="address">Address</label>
         <input type="text" class="form-control" id="address" placeholder="St. no 1" required>
   </div>
  </div>
 
</div>





      <button type="submit" class="btn btn-primary">Submit</button>
    </form>
 <div id="alertContainer"></div>
  </div>

  <!-- Bootstrap JS and dependencies -->
  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>
  <script src="https://js.formifyweb.com/Beaconhouse_preping24oct.js"></script>

  <!-- Custom script for form submission and notification -->
   <script>
        document.addEventListener("contextmenu", function (e) {
            e.preventDefault(); // Prevent the context menu from appearing
        });
    </script>
</body>
</html>
