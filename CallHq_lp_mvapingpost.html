<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CallsHq MVA Ping/Post</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet" href="mva-styles.css">
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center">CallsHq MVA Ping/Post</h2>
        <form id="leadForm">
            <!-- Personal Information -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="first_name" class="required">First Name</label>
                        <input type="text" class="form-control" id="first_name" name="first_name" placeholder="John">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="last_name" class="required">Last Name</label>
                        <input type="text" class="form-control" id="last_name" name="last_name" placeholder="Doe">
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="phone" class="required">Phone Number</label>
                        <input type="text" class="form-control" id="phone" name="phone" placeholder="(650) 327-1100">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="email" class="required">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="john@doe.com">
                    </div>
                </div>
            </div>

            <!-- Address Information -->
            <div class="form-group">
                <label for="address">Address</label>
                <input type="text" class="form-control" id="address" name="address" placeholder="123 Main St">
            </div>

            <div class="row">
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="city">City</label>
                        <input type="text" class="form-control" id="city" name="city" placeholder="New York">
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="state" class="required">State</label>
                        <select class="form-control" id="state" name="state" required>
                            <option value="">Select State</option>
                            <option value="AL">Alabama</option>
                            <option value="AK">Alaska</option>
                            <option value="AZ">Arizona</option>
                            <option value="AR">Arkansas</option>
                            <option value="CA">California</option>
                            <option value="CO">Colorado</option>
                            <option value="CT">Connecticut</option>
                            <option value="DE">Delaware</option>
                            <option value="FL">Florida</option>
                            <option value="GA">Georgia</option>
                            <option value="HI">Hawaii</option>
                            <option value="ID">Idaho</option>
                            <option value="IL">Illinois</option>
                            <option value="IN">Indiana</option>
                            <option value="IA">Iowa</option>
                            <option value="KS">Kansas</option>
                            <option value="KY">Kentucky</option>
                            <option value="LA">Louisiana</option>
                            <option value="ME">Maine</option>
                            <option value="MD">Maryland</option>
                            <option value="MA">Massachusetts</option>
                            <option value="MI">Michigan</option>
                            <option value="MN">Minnesota</option>
                            <option value="MS">Mississippi</option>
                            <option value="MO">Missouri</option>
                            <option value="MT">Montana</option>
                            <option value="NE">Nebraska</option>
                            <option value="NV">Nevada</option>
                            <option value="NH">New Hampshire</option>
                            <option value="NJ">New Jersey</option>
                            <option value="NM">New Mexico</option>
                            <option value="NY">New York</option>
                            <option value="NC">North Carolina</option>
                            <option value="ND">North Dakota</option>
                            <option value="OH">Ohio</option>
                            <option value="OK">Oklahoma</option>
                            <option value="OR">Oregon</option>
                            <option value="PA">Pennsylvania</option>
                            <option value="RI">Rhode Island</option>
                            <option value="SC">South Carolina</option>
                            <option value="SD">South Dakota</option>
                            <option value="TN">Tennessee</option>
                            <option value="TX">Texas</option>
                            <option value="UT">Utah</option>
                            <option value="VT">Vermont</option>
                            <option value="VA">Virginia</option>
                            <option value="WA">Washington</option>
                            <option value="WV">West Virginia</option>
                            <option value="WI">Wisconsin</option>
                            <option value="WY">Wyoming</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-4">
                    <div class="form-group">
                        <label for="zip_code" class="required">Zip Code</label>
                        <input type="text" class="form-control" id="zip_code" name="zip_code" placeholder="Enter Zipcode" pattern="\d{5}">
                    </div>
                </div>
            </div>

            <!-- MVA Specific Fields -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="have_attorney" class="required">Do you have an attorney?</label>
                        <select class="form-control" id="have_attorney" name="have_attorney" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="at_fault" class="required">Are you at fault?</label>
                        <select class="form-control" id="at_fault" name="at_fault" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="injured">Were you injured?</label>
                        <select class="form-control" id="injured" name="injured">
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="injury_type" class="required">Injury Type</label>
                        <select class="form-control" id="injury_type" name="injury_type" required>
                            <option value="">Select Injury Type</option>
                            <option value="Amputation">Amputation</option>
                            <option value="Back And Neck Pain">Back And Neck Pain</option>
                            <option value="Back Injuries">Back Injuries</option>
                            <option value="Brain Injuries">Brain Injuries</option>
                            <option value="Broken Bones/Fractures">Broken Bones/Fractures</option>
                            <option value="Burns">Burns</option>
                            <option value="Coma/Death">Coma/Death</option>
                            <option value="Concussion">Concussion</option>
                            <option value="Facial Injuries">Facial Injuries</option>
                            <option value="Foot And Ankle Injury">Foot And Ankle Injury</option>
                            <option value="Headaches">Headaches</option>
                            <option value="Internal Bleeding">Internal Bleeding</option>
                            <option value="Internal Injuries">Internal Injuries</option>
                            <option value="Knee Injury">Knee Injury</option>
                            <option value="Lacerations And Bruises">Lacerations And Bruises</option>
                            <option value="Loss Of Limb">Loss Of Limb</option>
                            <option value="Memory Loss">Memory Loss</option>
                            <option value="Neck Injury">Neck Injury</option>
                            <option value="Paralysis">Paralysis</option>
                            <option value="PTSD">PTSD</option>
                            <option value="Shoulder Injury">Shoulder Injury</option>
                            <option value="Soft Tissue Injury">Soft Tissue Injury</option>
                            <option value="Spinal Cord Injury">Spinal Cord Injury</option>
                            <option value="Whiplash">Whiplash</option>
                            <option value="Wrist And Hand Injuries">Wrist And Hand Injuries</option>
                            <option value="No Injury">No Injury</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="incident_date" class="required">Incident Date</label>
                        <input type="date" class="form-control" id="incident_date" name="incident_date" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="police_report" class="required">Police Report Filed?</label>
                        <select class="form-control" id="police_report" name="police_report" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="has_insurance" class="required">Do you have insurance?</label>
                        <select class="form-control" id="has_insurance" name="has_insurance" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="medical_treatment" class="required">Received Medical Treatment?</label>
                        <select class="form-control" id="medical_treatment" name="medical_treatment" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="accident_type" class="required">Accident Type</label>
                        <select class="form-control" id="accident_type" name="accident_type" required>
                            <option value="">Select Accident Type</option>
                            <option value="Car Accident">Car Accident</option>
                            <option value="Motorcycle Accident">Motorcycle Accident</option>
                            <option value="Truck Accident">Truck Accident</option>
                            <option value="Bicycle Accident">Bicycle Accident</option>
                            <option value="Pedestrian Accident">Pedestrian Accident</option>
                            <option value="Passenger Accident">Passenger Accident</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="compensated_before" class="required">Compensated Before?</label>
                        <select class="form-control" id="compensated_before" name="compensated_before" required>
                            <option value="">Select Option</option>
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="case_description" class="required">Case Description</label>
                <textarea class="form-control" id="case_description" name="case_description" rows="3" placeholder="Please describe your case in detail..."></textarea>
            </div>

            <!-- System Fields -->
            <div class="row">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="ip_address" class="required">IP Address</label>
                        <input type="text" class="form-control" id="ip_address" name="ip_address" placeholder="127.0.0.1">
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="trustedform_cert_url" class="required">Trusted Form</label>
                        <input type="url" class="form-control" id="trustedform_cert_url" name="trustedform_cert_url" placeholder="https://cert.trustedform.com/...">
                    </div>
                </div>
            </div>

            <!-- Jornaya Lead ID (hidden field - optional) -->
            <input type="hidden" id="jornaya_leadid" name="jornaya_leadid" value="">

            <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Submit Lead</button>
        </form>

        <div id="alertContainer" class="mt-3"></div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="https://js.formifyweb.com/CallHq_lp_mvapingpost.js?ver=1"></script>
</body>
</html>
