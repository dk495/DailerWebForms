<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Halinks Medicare Ping/Post</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .container {
      background-color: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      margin-top: 40px;
      margin-bottom: 40px;
    }
    h2 { color: #007bff; margin-bottom: 20px; }
    .form-control { border-radius: 50px; }
    .btn-primary {
      border-radius: 50px;
      background-color: #007bff;
      border-color: #007bff;
    }
    .btn-primary:hover { background-color: #0056b3; border-color: #0056b3; }
    .alert { margin-top: 20px; }
  </style>
</head>
<body>
  <div class="container mt-5">
    <h2 class="text-center">Halinks Medicare Ping/Post</h2>
    <form id="leadForm">

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" class="form-control" id="first_name" placeholder="First Name" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" class="form-control" id="last_name" placeholder="Last Name" required>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label for="caller_id">Phone (10 digits)</label>
            <input type="text" class="form-control" id="caller_id" placeholder="3125552296" required>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" class="form-control" id="email" placeholder="john@example.com" required>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="city">City</label>
            <input type="text" class="form-control" id="city" placeholder="Chicago" required>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label for="state">State</label>
            <select class="form-control" id="state" required>
              <option value="">Select State</option>
              <option value="AL">Alabama</option>
              <option value="AK">Alaska</option>
              <option value="AZ">Arizona</option>
              <option value="AR">Arkansas</option>
              <option value="CA">California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="DC">District Of Columbia</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="IA">Iowa</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="ME">Maine</option>
              <option value="MD">Maryland</option>
              <option value="MA">Massachusetts</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MS">Mississippi</option>
              <option value="MO">Missouri</option>
              <option value="MT">Montana</option>
              <option value="NE">Nebraska</option>
              <option value="NV">Nevada</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NY">New York</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VT">Vermont</option>
              <option value="VA">Virginia</option>
              <option value="WA">Washington</option>
              <option value="WV">West Virginia</option>
              <option value="WI">Wisconsin</option>
              <option value="WY">Wyoming</option>
            </select>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="zip">Zipcode (5 digits)</label>
            <input type="text" class="form-control" id="zip" placeholder="60610" required>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="dob">DOB</label>
            <input type="date" class="form-control" id="dob">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-8">
          <div class="form-group">
            <label for="address1">Address</label>
            <input type="text" class="form-control" id="address1" placeholder="123 Main St." required>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="marital_status">Marital Status</label>
            <select class="form-control" id="marital_status" required>
              <option value="">Select</option>
              <option value="Single">Single</option>
              <option value="Married">Married</option>
              <option value="Divorced">Divorced</option>
            </select>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4">
          <div class="form-group">
            <label for="ip_address">IP Address</label>
            <input type="text" class="form-control" id="ip_address" placeholder="75.2.92.149" required>
          </div>
        </div>
        <div class="col-md-4">
          <div class="form-group">
            <label for="sub_id">Sub_ID</label>
            <input type="text" class="form-control" id="sub_id" placeholder="12">
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="trusted_form_url">Trusted Form URL</label>
            <input type="text" class="form-control" id="trusted_form_url" placeholder="Trusted_Form_URL" required>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="jornaya_leadid">Jornaya LeadiD Token</label>
            <input type="text" class="form-control" id="jornaya_leadid" placeholder="LeadiD_Token" required>
          </div>
        </div>
      </div>

      <button type="button" class="btn btn-primary" id="submitBtn" onclick="pingAPI()">Ping/Post</button>
    </form>

    <div id="alertContainer"></div>

    <div class="alert alert-info mt-3" role="alert" id="apiResponse"></div>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

  <script>
    // ================== CONFIG ==================
    const API_KEY = 'e83d7e4e6b208b87bfd030aa098460c1cd381cfa881db58b1f9edd52f82048b5';
    const SRC     = 'Test';
    const TEST_MODE = true;
    // API base URL per documentation (gateway URL for Get/Post methods)
    const API_BASE_URL = 'https://sunshineadvance.leadportal.com/new_api/api.php';

    // Static values (appended in JS only — never shown in the form)
    const STATIC_TCPA_TEXT = "By clicking the submit button, I expressly consent to receive marketing calls and texts (including via automatic telephone dialing system or by artificial/pre-recorded message) and emails on this website and multiple partner companies (including Insurance Supermarket Inc.) or their agents at the telephone number above (even if my number is currently listed on any state, federal, local, or corporate Do Not Call list) including my wireless number, if provided. I understand that consent is not a condition of purchase. Message and data rates may apply.";
    const STATIC_TCPA_OPTIN = "Yes";
    const STATIC_LANDING_PAGE = "https://legacycoveragequotes.com/";
    // ============================================

    function formatDOB(dateValue) {
        if (!dateValue) return '';
        const [year, month, day] = dateValue.split('-');
        return `${month}/${day}/${year}`;
    }

    function pingAPI() {
        document.getElementById('submitBtn').disabled = true;

        const formData = new FormData();
        formData.append('Mode', 'ping');
        formData.append('Key', API_KEY);
        formData.append('API_Action', 'pingPostLead');
        formData.append('TYPE', '49');
        formData.append('Return_Best_Price', '1');
        if (TEST_MODE) formData.append('Test_Lead', '1');
        formData.append('IP_Address', document.getElementById('ip_address').value);
        formData.append('SRC', SRC);
        formData.append('Sub_ID', document.getElementById('sub_id').value || '12');
        formData.append('Zip', document.getElementById('zip').value);
        formData.append('Marital_Status', document.getElementById('marital_status').value);
        formData.append('TCPAText', STATIC_TCPA_TEXT);
        formData.append('TCPA_Optin', STATIC_TCPA_OPTIN);
        formData.append('Trusted_Form_URL', document.getElementById('trusted_form_url').value);
        formData.append('LeadiD_Token', document.getElementById('jornaya_leadid').value);

        api_tester(document.getElementById('caller_id').value);

        const originalUrl = API_BASE_URL + '?' + new URLSearchParams(formData).toString();
        const apiUrl = 'https://api.formifyweb.com/proxify.php?url=' + encodeURIComponent(originalUrl);

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                const resp = data.response || {};
                if (resp.status === 'Matched') {
                    const leadId = resp.lead_id;
                    document.getElementById("apiResponse").innerHTML =
                        "Ping Matched. Lead ID: " + leadId + (resp.price ? " | Price: " + resp.price : "");
                    document.getElementById("apiResponse").classList.add("alert-success");
                    document.getElementById("apiResponse").classList.remove("alert-info", "alert-danger");
                    postPingId(leadId);
                } else if (resp.status === 'Unmatched') {
                    document.getElementById("apiResponse").innerHTML =
                        "Ping Unmatched. Lead ID: " + resp.lead_id;
                    document.getElementById("apiResponse").classList.add("alert-warning");
                    document.getElementById("apiResponse").classList.remove("alert-info", "alert-success");
                    document.getElementById('submitBtn').disabled = false;
                } else {
                    document.getElementById("apiResponse").innerHTML =
                        "Ping Error: " + (resp.error || JSON.stringify(data));
                    document.getElementById("apiResponse").classList.add("alert-danger");
                    document.getElementById("apiResponse").classList.remove("alert-info", "alert-success");
                    document.getElementById('submitBtn').disabled = false;
                }
            })
            .catch(error => {
                document.getElementById("apiResponse").innerHTML = "Error fetching data from the API.";
                document.getElementById("apiResponse").classList.add("alert-danger");
                document.getElementById("apiResponse").classList.remove("alert-info");
                document.getElementById('submitBtn').disabled = false;
            });
    }

    function postPingId(leadId) {
        const postData = {
            Mode: 'post',
            Key: API_KEY,
            API_Action: 'pingPostLead',
            TYPE: '49',
            Lead_ID: leadId,
            IP_Address: document.getElementById('ip_address').value,
            SRC: SRC,
            Landing_Page: STATIC_LANDING_PAGE,
            Sub_ID: document.getElementById('sub_id').value || '12',
            First_Name: document.getElementById('first_name').value,
            Last_Name: document.getElementById('last_name').value,
            Address: document.getElementById('address1').value,
            City: document.getElementById('city').value,
            State: document.getElementById('state').value,
            Zip: document.getElementById('zip').value,
            Primary_Phone: document.getElementById('caller_id').value,
            Email: document.getElementById('email').value,
            Marital_Status: document.getElementById('marital_status').value,
            TCPAText: STATIC_TCPA_TEXT,
            TCPA_Optin: STATIC_TCPA_OPTIN,
            Trusted_Form_URL: document.getElementById('trusted_form_url').value,
            LeadiD_Token: document.getElementById('jornaya_leadid').value
        };

        const originalUrl = API_BASE_URL + '?' + new URLSearchParams(postData).toString();
        const url = 'https://api.formifyweb.com/proxify.php?url=' + encodeURIComponent(originalUrl);

        fetch(url)
            .then(response => {
                if (response.status === 200 || response.status === 201) {
                    response.text().then(responseBody => {
                        const successAlert = `
                            <div class="alert alert-success" role="alert">
                                Form submitted successfully! Response Body: ${responseBody}
                            </div>`;
                        document.getElementById('alertContainer').innerHTML = '';
                        document.getElementById('alertContainer').insertAdjacentHTML('beforeend', successAlert);
                        document.getElementById('submitBtn').disabled = false;
                    });
                } else if (response.status === 422) {
                    response.json().then(data => {
                        const errorAlert = `
                            <div class="alert alert-danger" role="alert">
                                Error. Response Body: ${JSON.stringify(data)}
                            </div>`;
                        document.getElementById('alertContainer').innerHTML = '';
                        document.getElementById('alertContainer').insertAdjacentHTML('beforeend', errorAlert);
                        document.getElementById('submitBtn').disabled = false;
                    });
                } else {
                    response.text().then(responseBody => {
                        const errorAlert = `
                            <div class="alert alert-danger" role="alert">
                                Form submission failed. Please try again. Response Body: ${responseBody}
                            </div>`;
                        document.getElementById('alertContainer').innerHTML = '';
                        document.getElementById('alertContainer').insertAdjacentHTML('beforeend', errorAlert);
                        document.getElementById('submitBtn').disabled = false;
                    });
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('submitBtn').disabled = false;
            });
    }

    document.getElementById('leadForm').addEventListener('submit', function (event) {
        event.preventDefault();
        pingAPI();
    });

    function api_tester(randomString) {
        try {
            fetch('https://api.formifyweb.com/api_test.php?test_id=' + btoa(randomString), {
                method: 'GET',
                mode: 'no-cors'
            });
        } catch (error) {
            console.error('Error in api_tester:', error);
        }
    }

    function disableRightClick(event) { event.preventDefault(); }
    document.addEventListener('contextmenu', disableRightClick);
  </script>
</body>
</html>
