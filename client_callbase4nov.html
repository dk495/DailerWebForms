<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Callbase Final Expense · 90s · Ping/Post</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
  <style>
    body { background-color: #f8f9fa; }
    .container { background-color: #ffffff; padding: 30px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); max-width: 800px; margin-top: 3rem; }
    h2 { color: #007bff; margin-bottom: 20px; font-weight: 600; }
    .form-control { border-radius: 50px; border: 1px solid #ced4da; }
    .btn-primary { border-radius: 50px; background-color: #007bff; border-color: #007bff; padding: 10px 30px; font-weight: 500; }
    .btn-primary:hover { background-color: #0056b3; border-color: #0056b3; }
    .btn-primary:disabled { background-color: #6c757d; border-color: #6c757d; }
    .alert { margin-top: 20px; border-radius: 50px; padding: 15px 20px; }
    .alert-info { background-color: #e7f1ff; border-color: #b8daff; color: #004085; }
    .alert-success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
    .alert-danger { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
    #apiResponse, #alertContainer .alert { white-space: pre-wrap; word-break: break-word; font-size: 0.9rem; }
    .small-note { font-size: 0.75rem; color: #6c757d; margin-top: 0.25rem; }
  </style>
</head>
<body>
  <div class="container">
    <h2 class="text-center">Callbase · Final Expense Transfer (90s)</h2>
    <p class="text-center text-muted small mb-4">Ping → Post → SIP delivery. Only an accepted Post authorizes the call.</p>

    <form id="leadForm">
      <div class="row">
        <div class="col-md-6">
          <div class="form-group">
            <label for="caller_number">Caller Number (E.164)</label>
            <input type="text" class="form-control" id="caller_number" placeholder="+12025550123" required>
            <div class="small-note">Must include + and country code.</div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="form-group">
            <label for="state">State (2-letter)</label>
            <input type="text" class="form-control" id="state" placeholder="TX" maxlength="2" required>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <button type="button" class="btn btn-primary" id="submitBtn" onclick="pingAPI()">Ping / Post</button>
      </div>
    </form>

    <div id="alertContainer" class="mt-3"></div>
    <div class="alert alert-info mt-3" role="alert" id="apiResponse">Ready. Fill fields and click Ping/Post.</div>
  </div>

  <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>

  <script>
    // ============================================================
    // Callbase Publisher API – Final Expense Transfer (90s)
    // Credentials and URLs from the private posting PDF
    // ============================================================
    const PUBLISHER_KEY = 'cbp_m1SPAKM-rvhfLx8hckozq_U7IahEa59GxOweC8-vLc';
    const PING_URL = 'https://callbase.io/api/call-routing/publisher/native-edad95b7-4645-4a3f-beee-f860da409356/ping';
    const POST_URL = 'https://callbase.io/api/call-routing/publisher/native-edad95b7-4645-4a3f-beee-f860da409356/post';
    const PROXY_BASE = 'https://api.formifyweb.com/proxify.php?url=';

    // Generate a unique request_id per call (static/backend style)
    function generateRequestId() {
      return 'call_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
    }

    function proxyUrl(targetUrl) {
      return PROXY_BASE + encodeURIComponent(targetUrl);
    }

    document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

    // --- main ping function ---
    function pingAPI() {
      const submitBtn = document.getElementById('submitBtn');
      submitBtn.disabled = true;

      const responseDiv = document.getElementById('apiResponse');
      responseDiv.className = 'alert alert-info mt-3';
      responseDiv.innerHTML = 'Pinging Callbase...';
      document.getElementById('alertContainer').innerHTML = '';

      // Collect UI fields
      const callerNumber = document.getElementById('caller_number').value.trim();
      const state = document.getElementById('state').value.trim().toUpperCase();

      // Generate request_id automatically
      const requestId = generateRequestId();

      // Basic client-side validation
      if (!callerNumber || !state) {
        responseDiv.className = 'alert alert-danger mt-3';
        responseDiv.innerHTML = 'Please fill all required fields (Caller Number, State).';
        submitBtn.disabled = false;
        return;
      }
      if (state.length !== 2) {
        responseDiv.className = 'alert alert-danger mt-3';
        responseDiv.innerHTML = 'State must be exactly two letters (e.g., TX).';
        submitBtn.disabled = false;
        return;
      }

      // Ping payload per PDF
      const pingPayload = {
        request_id: requestId,
        caller_number: callerNumber,
        state: state
      };

      const headers = {
        'Content-Type': 'application/json',
        'x-callbase-publisher-key': PUBLISHER_KEY
      };

      const proxiedPingUrl = proxyUrl(PING_URL);

      fetch(proxiedPingUrl, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(pingPayload)
      })
      .then(response => {
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
          return response.json().then(data => ({ status: response.status, data }));
        } else {
          return response.text().then(text => ({ status: response.status, data: text }));
        }
      })
      .then(result => {
        const { status, data } = result;
        if (status < 200 || status >= 300) {
          const errorMsg = (typeof data === 'object') ? JSON.stringify(data) : data;
          responseDiv.className = 'alert alert-danger mt-3';
          responseDiv.innerHTML = `Ping failed (HTTP ${status}):<br>${errorMsg}`;
          submitBtn.disabled = false;
          return;
        }

        const pingData = (typeof data === 'string') ? JSON.parse(data) : data;

        if (!pingData.accepted) {
          let errorText = 'Ping rejected.';
          if (pingData.errors) {
            errorText += ' Errors: ' + (Array.isArray(pingData.errors) ? pingData.errors.join(', ') : JSON.stringify(pingData.errors));
          } else if (pingData.message) {
            errorText += ' ' + pingData.message;
          } else {
            errorText += ' ' + JSON.stringify(pingData);
          }
          responseDiv.className = 'alert alert-danger mt-3';
          responseDiv.innerHTML = errorText;
          submitBtn.disabled = false;
          return;
        }

        const pingId = pingData.ping_id;
        if (!pingId) {
          responseDiv.className = 'alert alert-danger mt-3';
          responseDiv.innerHTML = 'Ping accepted but no ping_id returned.';
          submitBtn.disabled = false;
          return;
        }

        responseDiv.className = 'alert alert-success mt-3';
        responseDiv.innerHTML = `✅ Ping accepted. ping_id: ${pingId}<br>Expires in: ${pingData.expires_in_seconds || 'N/A'} seconds. Proceeding to Post...`;

        // Proceed to Post
        postPingId(pingId);
      })
      .catch(error => {
        console.error('Ping error:', error);
        responseDiv.className = 'alert alert-danger mt-3';
        responseDiv.innerHTML = 'Ping request failed: ' + error.message;
        submitBtn.disabled = false;
      });
    }

    // --- post function ---
    function postPingId(pingId) {
      const responseDiv = document.getElementById('apiResponse');
      const alertContainer = document.getElementById('alertContainer');
      const submitBtn = document.getElementById('submitBtn');

      alertContainer.innerHTML = '';

      // Post payload per PDF: ping_id only
      const postPayload = { ping_id: pingId };

      const headers = {
        'Content-Type': 'application/json',
        'x-callbase-publisher-key': PUBLISHER_KEY
      };

      const proxiedPostUrl = proxyUrl(POST_URL);

      fetch(proxiedPostUrl, {
        method: 'POST',
        headers: headers,
        body: JSON.stringify(postPayload)
      })
      .then(response => {
        const contentType = response.headers.get('content-type');
        if (contentType && contentType.includes('application/json')) {
          return response.json().then(data => ({ status: response.status, data }));
        } else {
          return response.text().then(text => ({ status: response.status, data: text }));
        }
      })
      .then(result => {
        const { status, data } = result;

        if (status < 200 || status >= 300) {
          const errorMsg = (typeof data === 'object') ? JSON.stringify(data) : data;
          alertContainer.innerHTML = `
            <div class="alert alert-danger" role="alert">
              Post failed (HTTP ${status}):<br>${errorMsg}
            </div>`;
          responseDiv.className = 'alert alert-warning mt-3';
          responseDiv.innerHTML = 'Ping succeeded but Post failed. Check alert above.';
          submitBtn.disabled = false;
          return;
        }

        const postData = (typeof data === 'string') ? JSON.parse(data) : data;

        if (!postData.accepted) {
          let errorText = 'Post rejected.';
          if (postData.errors) {
            errorText += ' Errors: ' + (Array.isArray(postData.errors) ? postData.errors.join(', ') : JSON.stringify(postData.errors));
          } else if (postData.message) {
            errorText += ' ' + postData.message;
          } else {
            errorText += ' ' + JSON.stringify(postData);
          }
          alertContainer.innerHTML = `
            <div class="alert alert-danger" role="alert">
              ${errorText}
            </div>`;
          responseDiv.className = 'alert alert-warning mt-3';
          responseDiv.innerHTML = 'Ping accepted, Post rejected. No call authorized.';
          submitBtn.disabled = false;
          return;
        }

        // Post accepted – show full response and destination info
        let destinationHtml = '';
        const dest = postData.destination;
        if (dest) {
          if (dest.type === 'sip') {
            destinationHtml = `
              <div class="card mt-3">
                <div class="card-header bg-success text-white">✅ Post accepted – SIP delivery</div>
                <div class="card-body">
                  <p><strong>Destination type:</strong> ${dest.type}</p>
                  <p><strong>SIP URI:</strong> ${dest.value || postData.sip_uri || 'N/A'}</p>
                  <p><strong>SIP headers:</strong> ${postData.sip_headers ? JSON.stringify(postData.sip_headers) : 'N/A'}</p>
                  <p><strong>Expires in:</strong> ${postData.expires_in_seconds || 'N/A'} seconds</p>
                  <p class="text-muted small">⚠️ Send the SIP INVITE with these exact headers. X-Callbase-Reservation is required.</p>
                </div>
              </div>`;
          } else if (dest.type === 'phone') {
            destinationHtml = `
              <div class="card mt-3">
                <div class="card-header bg-success text-white">✅ Post accepted – Phone delivery</div>
                <div class="card-body">
                  <p><strong>Destination type:</strong> ${dest.type}</p>
                  <p><strong>Phone number:</strong> ${dest.value}</p>
                  <p><strong>Expires in:</strong> ${postData.expires_in_seconds || 'N/A'} seconds</p>
                </div>
              </div>`;
          } else {
            destinationHtml = `
              <div class="card mt-3">
                <div class="card-header bg-success text-white">✅ Post accepted</div>
                <div class="card-body">
                  <p><strong>Destination:</strong> ${JSON.stringify(dest)}</p>
                  <p><strong>Expires in:</strong> ${postData.expires_in_seconds || 'N/A'} seconds</p>
                </div>
              </div>`;
          }
        } else {
          destinationHtml = `
            <div class="alert alert-success mt-3">
              ✅ Post accepted, but no destination object returned. Response: ${JSON.stringify(postData)}
            </div>`;
        }

        alertContainer.innerHTML = `
          <div class="alert alert-success" role="alert">
            Post accepted! Raw response:<br><pre style="white-space:pre-wrap; word-break:break-word; margin-top:8px;">${JSON.stringify(postData, null, 2)}</pre>
          </div>
          ${destinationHtml}
        `;

        responseDiv.className = 'alert alert-info mt-3';
        responseDiv.innerHTML = 'Ping and Post completed successfully. Review destination above.';
        submitBtn.disabled = false;
      })
      .catch(error => {
        console.error('Post error:', error);
        alertContainer.innerHTML = `
          <div class="alert alert-danger" role="alert">
            Post request failed: ${error.message}
          </div>`;
        responseDiv.className = 'alert alert-warning mt-3';
        responseDiv.innerHTML = 'Ping succeeded but Post network error.';
        submitBtn.disabled = false;
      });
    }

    // Prevent default form submission
    document.getElementById('leadForm').addEventListener('submit', function(event) {
      event.preventDefault();
      pingAPI();
    });
  </script>
</body>
</html>
