<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>Knovatik Optin Request Form</title>
    <!-- Google Font + Bootstrap 4 + Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(145deg, #f6f9fc 0%, #e9f0f5 100%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ---------- HEADER (beautiful, glassmorphism touch) ---------- */
        .knov-header {
            width: 100%;
            max-width: 820px;
            margin: 0 auto 2.5rem auto;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 60px;
            padding: 0.9rem 2.2rem;
            box-shadow: 0 12px 40px -8px rgba(0, 20, 40, 0.12), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            transition: all 0.2s ease;
        }

        .knov-header .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .knov-header .brand i {
            font-size: 2.2rem;
            color: #0a2a44;
            background: #ffb347;
            padding: 10px;
            border-radius: 50%;
            box-shadow: 0 6px 14px rgba(255, 180, 60, 0.35);
            transition: transform 0.15s;
        }

        .knov-header .brand:hover i {
            transform: scale(1.02) rotate(-2deg);
        }

        .knov-header .brand h1 {
            font-weight: 700;
            font-size: 1.9rem;
            letter-spacing: -0.5px;
            color: #0a2a44;
            margin: 0;
            line-height: 1.2;
        }

        .knov-header .brand h1 span {
            color: #ffb347;
            background: #0a2a44;
            padding: 0.1rem 0.9rem;
            border-radius: 40px;
            font-size: 1.2rem;
            font-weight: 600;
            margin-left: 6px;
            letter-spacing: 0.3px;
        }

        .knov-header .badge-optin {
            background: #0a2a44;
            color: #fff;
            padding: 0.5rem 1.5rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.4px;
            box-shadow: 0 4px 10px rgba(10, 42, 68, 0.2);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .knov-header .badge-optin i {
            font-size: 0.9rem;
            color: #ffb347;
        }

        /* ---------- MAIN CARD (center) ---------- */
        .card-ssdi {
            width: 100%;
            max-width: 560px;
            background: #ffffff;
            border-radius: 48px;
            padding: 2.8rem 2.5rem;
            box-shadow: 0 30px 60px -20px rgba(0, 20, 40, 0.25), 0 0 0 1px rgba(255, 255, 255, 0.5) inset;
            backdrop-filter: blur(2px);
            transition: transform 0.2s ease, box-shadow 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.4);
            text-align: center;
        }

        .card-ssdi:hover {
            transform: translateY(-4px);
            box-shadow: 0 40px 70px -16px rgba(0, 20, 40, 0.3);
        }

        .card-ssdi .icon-wrapper {
            background: #f0f6fe;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.2rem auto;
            box-shadow: 0 8px 18px rgba(10, 42, 68, 0.08);
        }

        .card-ssdi .icon-wrapper i {
            font-size: 2.8rem;
            color: #0a2a44;
        }

        .card-ssdi h2 {
            font-weight: 700;
            font-size: 2.2rem;
            letter-spacing: -0.5px;
            color: #0a2a44;
            margin-bottom: 0.4rem;
        }

        .card-ssdi h2 small {
            font-weight: 400;
            font-size: 1.1rem;
            color: #4a6479;
            display: block;
            margin-top: 0.2rem;
            letter-spacing: 0.2px;
        }

        .card-ssdi .subhead {
            color: #3a5670;
            font-weight: 400;
            font-size: 1rem;
            margin: 0.6rem 0 1.8rem 0;
            padding: 0 0.5rem;
            border-top: 2px dashed #e3eaf0;
            border-bottom: 2px dashed #e3eaf0;
            padding: 0.8rem 0;
            display: inline-block;
        }

        .card-ssdi .subhead i {
            color: #ffb347;
            margin-right: 6px;
        }

        .card-ssdi .btn-ssdi {
            background: linear-gradient(145deg, #0a2a44, #123b5e);
            border: none;
            padding: 1rem 2.5rem;
            font-weight: 600;
            font-size: 1.25rem;
            letter-spacing: 0.3px;
            border-radius: 60px;
            color: #fff;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 10px 24px -6px rgba(10, 42, 68, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .card-ssdi .btn-ssdi i {
            font-size: 1.2rem;
            color: #ffb347;
            transition: transform 0.2s;
        }

        .card-ssdi .btn-ssdi:hover {
            background: linear-gradient(145deg, #123b5e, #1a4a7a);
            transform: scale(1.02);
            box-shadow: 0 14px 30px -6px rgba(10, 42, 68, 0.4);
        }

        .card-ssdi .btn-ssdi:hover i {
            transform: translateX(4px);
        }

        .card-ssdi .btn-ssdi:active {
            transform: scale(0.98);
        }

        .card-ssdi .footnote {
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #5e7a92;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .card-ssdi .footnote i {
            color: #ffb347;
        }

        .card-ssdi .footnote span {
            background: #f0f4f9;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            font-weight: 500;
            color: #0a2a44;
        }

        /* ---------- FOOTER (minimal, elegant) ---------- */
        .knov-footer {
            width: 100%;
            max-width: 820px;
            margin-top: 3rem;
            text-align: center;
            color: #4a5c6e;
            font-size: 0.85rem;
            font-weight: 400;
            border-top: 1px solid rgba(0, 0, 0, 0.04);
            padding-top: 1.5rem;
            letter-spacing: 0.2px;
        }

        .knov-footer i {
            color: #ffb347;
            margin: 0 4px;
        }

        /* ---------- responsive ---------- */
        @media (max-width: 600px) {
            .knov-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 0.8rem;
                padding: 1.2rem 1.5rem;
                border-radius: 40px;
            }
            .knov-header .brand h1 {
                font-size: 1.5rem;
            }
            .knov-header .brand h1 span {
                font-size: 1rem;
                padding: 0.1rem 0.7rem;
            }
            .knov-header .badge-optin {
                align-self: flex-start;
                font-size: 0.8rem;
                padding: 0.3rem 1.2rem;
            }
            .card-ssdi {
                padding: 2rem 1.5rem;
                border-radius: 36px;
            }
            .card-ssdi h2 {
                font-size: 1.8rem;
            }
            .card-ssdi .btn-ssdi {
                font-size: 1.1rem;
                padding: 0.9rem 1.5rem;
            }
            .card-ssdi .icon-wrapper {
                width: 68px;
                height: 68px;
            }
            .card-ssdi .icon-wrapper i {
                font-size: 2.2rem;
            }
        }

        @media (max-width: 400px) {
            .knov-header .brand i {
                font-size: 1.6rem;
                padding: 8px;
            }
            .card-ssdi {
                padding: 1.5rem 1.2rem;
            }
        }
    </style>
</head>
<body>

    <!-- HEADER: "Optin Request" + Knovatik branding -->
    <header class="knov-header">
        <div class="brand">
            <i class="fas fa-shield-alt"></i>
            <h1>Knovatik <span>SSDI</span></h1>
        </div>
        <div class="badge-optin">
            <i class="fas fa-pen-fancy"></i> Optin Request
        </div>
    </header>

    <!-- CENTER CARD: SSDI optin + redirect button -->
    <div class="card-ssdi">
        <div class="icon-wrapper">
            <i class="fas fa-file-medical-alt"></i>
        </div>
        <h2>
            SSDI Optin
            <small>Social Security Disability</small>
        </h2>
        <div class="subhead">
            <i class="fas fa-arrow-right"></i> Complete your opt-in request
        </div>

        <!-- Redirect button: external link -->
        <a href="http://144.126.132.18:5001/knovatik_ssdiOptin.html" 
           class="btn-ssdi" 
           role="button"
           aria-label="Go to SSDI opt-in form">
            <i class="fas fa-external-link-alt"></i> Go to Optin Form
            <i class="fas fa-chevron-right" style="font-size: 0.9rem; opacity: 0.8;"></i>
        </a>

        <div class="footnote">
            <i class="fas fa-lock"></i> secure · 
            <span><i class="far fa-clock"></i> 2 min</span>
            <i class="fas fa-shield-alt" style="margin-left: 4px;"></i>
        </div>
    </div>

    <!-- FOOTER (clean) -->
    <footer class="knov-footer">
        <i class="fas fa-copyright"></i> 2026 Knovatik · Optin Request Form
        <span style="margin: 0 8px;">|</span> 
        <i class="fas fa-phone-alt" style="font-size: 0.7rem;"></i> SSDI campaign
    </footer>

    <!-- Bootstrap JS (optional for any toggles, but not strictly needed) -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
