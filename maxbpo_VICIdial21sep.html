<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MaxBPO Agent Availability Ping</title>

    <link rel="stylesheet"
          href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            color: #007bff;
            margin-bottom: 30px;
        }

        .form-control {
            border-radius: 50px;
        }

        .btn-primary {
            border-radius: 50px;
            padding-left: 25px;
            padding-right: 25px;
        }

        .alert {
            margin-top: 25px;
            word-break: break-word;
        }

        #apiResponse {
            white-space: pre-wrap;
            font-family: monospace;
        }
    </style>
</head>

<body>

<div class="container mt-5">

    <h2 class="text-center">
        MaxBPO Agent Availability Ping
    </h2>

    <form id="leadForm">

        <div class="row">

            <div class="col-md-12">

                <div class="form-group">

                    <label for="user_group">
                        User Group
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="user_group"
                        name="user_group"
                        value="Fronters"
                        placeholder="Enter VICIdial User Group"
                        required
                    >

                    <small class="form-text text-muted">
                        Example: Fronters
                    </small>

                </div>

            </div>

        </div>

        <button
            type="submit"
            class="btn btn-primary"
            id="submitBtn"
        >
            Ping
        </button>

    </form>

    <div id="alertContainer"></div>

</div>


<script>

document.getElementById('leadForm').addEventListener(
    'submit',
    async function(event) {

        event.preventDefault();

        const submitBtn =
            document.getElementById('submitBtn');

        const alertContainer =
            document.getElementById('alertContainer');

        const userGroup =
            document.getElementById('user_group')
            .value
            .trim();


        // Check user group

        if (!userGroup) {

            alertContainer.innerHTML = `
                <div class="alert alert-danger">
                    Please enter a User Group.
                </div>
            `;

            return;
        }


        submitBtn.disabled = true;
        submitBtn.textContent = 'Checking...';

        alertContainer.innerHTML = `
            <div class="alert alert-info">
                Contacting VICIdial...
            </div>
        `;


        /*
        ==========================================
        VICIDIAL PARAMETERS
        ==========================================
        */

        const params = new URLSearchParams();

        params.set('source', 'LeadVendor');

        params.set('user', '9060');

        params.set(
            'pass',
            'apiLeadVendorpingstring9060'
        );

        params.set(
            'function',
            'user_group_status'
        );

        params.set(
            'user_groups',
            userGroup
        );

        params.set(
            'header',
            'NO'
        );


        /*
        ==========================================
        VICIDIAL URL
        ==========================================
        */

        const vicidialUrl =
            'http://12.109.206.74/vicidial/non_agent_api2.php?'
            + params.toString();


        /*
        ==========================================
        FORMIFY PROXY URL
        ==========================================
        */

        const proxyUrl =
            'https://api.formifyweb.com/proxify.php?url='
            + encodeURIComponent(vicidialUrl);


        console.log(
            'Requesting:',
            vicidialUrl
        );


        try {

            const response =
                await fetch(proxyUrl, {
                    method: 'GET',
                    cache: 'no-store'
                });


            const responseBody =
                await response.text();


            console.log(
                'HTTP Status:',
                response.status
            );

            console.log(
                'API Response:',
                responseBody
            );


            /*
            ======================================
            HTTP ERROR
            ======================================
            */

            if (!response.ok) {

                alertContainer.innerHTML = `
                    <div class="alert alert-danger">

                        <h5>
                            API Request Failed
                        </h5>

                        <hr>

                        <strong>
                            HTTP Status:
                        </strong>

                        ${response.status}

                        <br><br>

                        <strong>
                            Response:
                        </strong>

                        <div id="apiResponse">
                            ${escapeHtml(responseBody)}
                        </div>

                    </div>
                `;

                return;
            }


            /*
            ======================================
            SUCCESS
            ======================================
            */

            alertContainer.innerHTML = `
                <div class="alert alert-success">

                    <h5>
                        Agent Availability Ping Successful
                    </h5>

                    <hr>

                    <strong>
                        User Group:
                    </strong>

                    ${escapeHtml(userGroup)}

                    <br><br>

                    <strong>
                        HTTP Status:
                    </strong>

                    ${response.status}

                    <br><br>

                    <strong>
                        VICIdial Response:
                    </strong>

                    <div id="apiResponse">
                        ${escapeHtml(responseBody)}
                    </div>

                </div>
            `;

        }

        catch(error) {

            console.error(
                'Request Error:',
                error
            );

            alertContainer.innerHTML = `
                <div class="alert alert-danger">

                    <h5>
                        Connection Error
                    </h5>

                    <hr>

                    ${escapeHtml(error.message)}

                </div>
            `;

        }

        finally {

            submitBtn.disabled = false;

            submitBtn.textContent = 'Ping';

        }

    }
);



function escapeHtml(value) {

    const div =
        document.createElement('div');

    div.textContent =
        String(value);

    return div.innerHTML;
}

</script>

</body>
</html>
