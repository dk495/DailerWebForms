<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maxbpo VICIdial Agent Availability Ping</title>

    <link
        rel="stylesheet"
        href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css"
    >

    <style>
        body {
            background-color: #f8f9fa;
        }

        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h2 {
            color: #007bff;
            margin-bottom: 20px;
        }

        .form-control {
            border-radius: 50px;
        }

        .btn-primary {
            border-radius: 50px;
            background-color: #007bff;
            border-color: #007bff;
        }

        .btn-primary:hover {
            background-color: #0056b3;
            border-color: #0056b3;
        }

        .alert {
            margin-top: 20px;
            word-break: break-word;
        }
    </style>
</head>


<body>

<div class="container mt-5">

    <h2 class="text-center">
      Maxbpo Agent Availability Ping
    </h2>


    <form id="leadForm">

        <div class="row">

            <div class="col-md-12">

                <div class="form-group">

                    <label for="user_group">
                        User Group
                    </label>

                    <input
                        type="text"
                        class="form-control"
                        id="user_group"
                        value="Fronters"
                        readonly
                    >

                </div>

            </div>

        </div>


        <button
            type="submit"
            class="btn btn-primary"
            id="submitBtn"
        >
            Ping
        </button>

    </form>


    <div id="alertContainer"></div>

</div>


<!-- Bootstrap -->
<script src="https://code.jquery.com/jquery-3.2.1.slim.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js"></script>

<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js"></script>


<script>

/*
=================================================
    VICIDIAL AGENT AVAILABILITY API
=================================================
*/

document.getElementById('leadForm')
.addEventListener('submit', function(event) {

    event.preventDefault();


    const submitBtn =
        document.getElementById('submitBtn');

    const alertContainer =
        document.getElementById('alertContainer');

    const userGroup =
        document.getElementById('user_group').value;


    // Disable button while checking

    submitBtn.disabled = true;
    submitBtn.innerHTML = 'Checking...';


    // Clear old response

    alertContainer.innerHTML = '';


    /*
    =============================================
        BUILD VICIDIAL API PARAMETERS
    =============================================
    */

    const params = new URLSearchParams();

    params.append(
        'source',
        'LeadVendor'
    );

    params.append(
        'user',
        '9060'
    );

    // Insert your current API password here
    params.append(
        'pass',
        'apiLeadVendorpingstring9060'
    );

    params.append(
        'function',
        'user_group_status'
    );

    params.append(
        'user_groups',
        userGroup
    );

    params.append(
        'header',
        'NO'
    );


    /*
    =============================================
        ORIGINAL VICIDIAL API URL
    =============================================
    */

    const originalUrl =
        'http://12.109.206.74/vicidial/non_agent_api2.php?'
        + params.toString();


    /*
    =============================================
        FORMIFY PROXY
    =============================================

    Your website is HTTPS while VICIdial is HTTP.

    Send the VICIdial request through your
    existing Formify proxy.
    */

    const url =
        'https://api.formifyweb.com/proxify.php?url='
        + encodeURIComponent(originalUrl);


    console.log(
        'VICIdial Request:',
        originalUrl
    );


    /*
    =============================================
        SEND REQUEST
    =============================================
    */

    fetch(url, {

        method: 'GET'

    })

    .then(response => {

        return response.text()
        .then(responseBody => {

            console.log(
                'HTTP Status:',
                response.status
            );

            console.log(
                'VICIdial Response:',
                responseBody
            );


            /*
            =====================================
                SUCCESS
            =====================================
            */

            if (response.ok) {

                const successAlert = `

                    <div
                        class="alert alert-success"
                        role="alert"
                    >

                        <strong>
                            ${response.status}
                            : Agent Availability Ping Successful
                        </strong>

                        <br><br>

                        <strong>
                            User Group:
                        </strong>

                        ${userGroup}

                        <br><br>

                        <strong>
                            API Response:
                        </strong>

                        <br>

                        ${escapeHtml(responseBody)}

                    </div>

                `;


                alertContainer.innerHTML =
                    successAlert;

            }


            /*
            =====================================
                HTTP ERROR
            =====================================
            */

            else {

                const errorAlert = `

                    <div
                        class="alert alert-danger"
                        role="alert"
                    >

                        <strong>
                            API Request Failed
                        </strong>

                        <br><br>

                        HTTP Status:
                        ${response.status}

                        <br><br>

                        Response:

                        <br>

                        ${escapeHtml(responseBody)}

                    </div>

                `;


                alertContainer.innerHTML =
                    errorAlert;

            }

        });

    })


    /*
    =============================================
        CONNECTION ERROR
    =============================================
    */

    .catch(error => {

        console.error(
            'API Error:',
            error
        );


        const errorAlert = `

            <div
                class="alert alert-danger"
                role="alert"
            >

                <strong>
                    Connection Error
                </strong>

                <br><br>

                ${escapeHtml(error.message)}

            </div>

        `;


        alertContainer.innerHTML =
            errorAlert;

    })


    /*
    =============================================
        ENABLE BUTTON AGAIN
    =============================================
    */

    .finally(() => {

        submitBtn.disabled = false;

        submitBtn.innerHTML =
            'Ping';

    });

});


/*
=================================================
    ESCAPE API RESPONSE BEFORE DISPLAYING
=================================================
*/

function escapeHtml(value) {

    const div =
        document.createElement('div');

    div.textContent =
        value;

    return div.innerHTML;

}


/*
=================================================
    DISABLE RIGHT CLICK
=================================================
*/

document.addEventListener(
    'contextmenu',
    function(event) {

        event.preventDefault();

    }
);

</script>


</body>
</html>
