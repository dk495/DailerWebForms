<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Vize · Optin Request</title>
  <!-- Bootstrap 4 + Font Awesome -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: linear-gradient(145deg, #f0faf0 0%, #dceee0 100%);
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }

    /* ----- main card – fresh light green & white ----- */
    .front-card {
      background: #ffffff;
      border-radius: 56px;
      padding: 3rem 2.8rem;
      max-width: 580px;
      width: 100%;
      box-shadow: 0 30px 56px -18px rgba(40, 90, 60, 0.24);
      border: 1px solid rgba(130, 200, 150, 0.25);
      text-align: center;
      transition: box-shadow 0.25s, transform 0.2s;
    }
    .front-card:hover {
      box-shadow: 0 40px 64px -20px rgba(40, 90, 60, 0.30);
      transform: translateY(-4px);
    }

    .front-card .icon-big {
      font-size: 4.2rem;
      color: #2d8a44;
      background: #eaf9ee;
      width: 100px;
      height: 100px;
      line-height: 100px;
      border-radius: 50%;
      margin: 0 auto 1.4rem;
      display: inline-block;
      box-shadow: 0 8px 20px rgba(50, 140, 80, 0.12);
    }
    .front-card .icon-big i {
      vertical-align: middle;
    }

    .front-card h1 {
      font-weight: 700;
      color: #1b4d2a;
      font-size: 2.5rem;
      letter-spacing: -0.5px;
      margin-bottom: 0.3rem;
    }
    .front-card .subhead {
      font-size: 1.1rem;
      color: #2d6a3e;
      font-weight: 400;
      background: #ecf8ef;
      display: inline-block;
      padding: 0.2rem 1.6rem;
      border-radius: 60px;
      margin-bottom: 1.8rem;
      border: 1px solid #b8dfc0;
    }
    .front-card .desc {
      color: #2a4d33;
      font-size: 1.05rem;
      line-height: 1.6;
      margin-bottom: 2.2rem;
      padding: 0 0.5rem;
    }
    .front-card .desc i {
      color: #308a48;
      margin-right: 6px;
    }

    /* ----- green CTA button ----- */
    .btn-optin {
      background: linear-gradient(145deg, #2d8a44, #1f6e34);
      border: none;
      padding: 18px 32px;
      font-weight: 600;
      border-radius: 60px;
      font-size: 1.3rem;
      color: white;
      box-shadow: 0 10px 28px rgba(40, 130, 70, 0.30);
      transition: 0.2s;
      letter-spacing: 0.5px;
      width: 100%;
      max-width: 340px;
      margin: 0 auto;
    }
    .btn-optin:hover {
      background: linear-gradient(145deg, #38a052, #267e3a);
      transform: scale(1.02);
      box-shadow: 0 14px 34px rgba(40, 130, 70, 0.38);
      color: white;
      text-decoration: none;
    }
    .btn-optin i {
      margin-right: 12px;
    }

    /* ----- subtle footer (light) ----- */
    .front-footer {
      margin-top: 40px;
      color: #2d5a3a;
      font-size: 0.9rem;
      background: #ffffffd9;
      padding: 12px 28px;
      border-radius: 60px;
      backdrop-filter: blur(2px);
      border: 1px solid #bfdfc6;
      box-shadow: 0 4px 12px rgba(0,30,10,0.04);
    }
    .front-footer i {
      color: #2b7a42;
    }

    /* responsive */
    @media (max-width: 480px) {
      .front-card { padding: 2rem 1.5rem; }
      .front-card h1 { font-size: 2rem; }
      .front-card .icon-big { width: 80px; height: 80px; line-height: 80px; font-size: 3.4rem; }
      .btn-optin { font-size: 1.1rem; padding: 16px 20px; }
    }
  </style>
</head>
<body>

  <!-- ===== FRONT CARD ===== -->
  <div class="front-card">
    <div class="icon-big">
      <i class="fas fa-hand-holding-heart"></i>
    </div>
    <h1>Vize Optin Request</h1>
    <div class="subhead">
      <i class="fas fa-file-invoice mr-1"></i> Final Expense
    </div>
    <p class="desc">
      <i class="fas fa-check-circle"></i> Secure &amp; fast · campaign: fe<br>
      <span style="font-size:0.95rem; color:#2f6040;">Click below to start your Final Expense opt-in</span>
    </p>

    <!-- redirects to http://144.126.132.18:5001/vize_OptinFE.html -->
    <a href="http://144.126.132.18:5001/vize_OptinFE.html" class="btn-optin d-inline-block text-center">
      <i class="fas fa-arrow-right"></i> Go to Form
    </a>

    <!-- tiny extra hint -->
    <div style="margin-top: 1.8rem; font-size: 0.85rem; color: #2d6a3e; background: #f2fcf4; border-radius: 40px; padding: 6px 14px; display: inline-block; border: 1px solid #b5dfbd;">
      <i class="fas fa-shield-alt mr-1"></i> SSL secured · 128-bit
    </div>
  </div>

  <!-- footer -->
  <div class="front-footer">
    <i class="fas fa-copyright mr-1"></i> 2026 Vize · Final Expense Optin
  </div>

  <!-- (no extra scripts needed) -->
  <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
